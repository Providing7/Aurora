dependencies {
    //Spring boot web + JPA (persiste denúncia)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    //PostgreSQL (só persiste text/UUID/numeric)
    runtimeOnly 'org.postgresql:postgresql:42.7.3'

    //Flyway migrations
    implementation 'org.flywaydb:flyway-core:10.8.1'
    implementation 'org.flywaydb:flyway-database-postgresql:10.8.1'

    //Kafka producer (publica conexa.ingestion.denuncia.criada)
    implementation 'org.springframework.kafka:spring-kafka'

    //FLE: AES-GCM-256 para relato, nome, contato(seção 10)
    implementation 'org.springframework.security:spring-security-crypto'

    //Observability + Mascaramento de logs
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'    

    //Testing
    testImplementation 'org.testcontainers:testcontainers:1.20.0'
    testImplementation 'org.testcontainers:postgresql:1.20.0'
    testImplementation 'org.testcontainers:kafka:1.20.0'
}